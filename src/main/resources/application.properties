spring.application.name=Online_Food_Ordering



# ===== Server =====
server.port=8080

# ===== MySQL Datasource =====
spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update: auto-creates/updates tables (use "validate" or "none" in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Connection ePool (HikariCP) =====
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
server.error.include-message=always
#aws secreat and access key

aws.s3.bucketname=darshana-microservice-files-2026


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB